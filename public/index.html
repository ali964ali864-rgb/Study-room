<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>Study Room</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="logo">◒</span><span>Study Room</span></div>
      <div id="roomBadge" class="room-badge hidden">ROOM <b id="roomCode"></b><button id="copyRoom" title="Copy room code">⧉</button></div>
    </header>

    <main>
      <section id="lobby" class="lobby">
        <div class="hero">
          <div class="eyebrow">FOCUS TOGETHER</div>
          <h1>Your private room<br><em>for getting things done.</em></h1>
          <p>Create a room, invite your friends with a code, and study together without leaving the page.</p>
        </div>
        <div class="card lobby-card">
          <label>Your name</label>
          <input id="nameInput" maxlength="24" placeholder="e.g. Ali" autocomplete="name">
          <div class="lobby-actions">
            <button id="createBtn" class="primary">Create room</button>
            <div class="or">or</div>
            <div class="join-row">
              <input id="codeInput" maxlength="6" placeholder="ROOM CODE" autocomplete="off">
              <button id="joinBtn">Join</button>
            </div>
          </div>
          <p id="lobbyError" class="error"></p>
        </div>
      </section>

      <section id="room" class="room hidden">
        <div class="room-grid">
          <div class="main-panel">
            <div class="timer-card">
              <div class="timer-head">
                <div>
                  <span id="phase" class="phase">STUDY</span>
                  <h2 id="timer">50:00</h2>
                </div>
                <div class="people"><span class="dot"></span><span id="peopleCount">1</span> studying</div>
              </div>
              <div class="progress"><div id="progressBar"></div></div>
              <div class="timer-controls">
                <button id="startBtn" class="primary big">Start</button>
                <button id="resetBtn">Reset</button>
                <button id="skipBtn">Skip</button>
                <button id="settingsBtn" class="icon-btn">⚙</button>
              </div>
            </div>

            <div class="members card">
              <div class="section-title"><span>People in room</span><span id="roomCodeSmall"></span></div>
              <div id="membersList"></div>
            </div>
          </div>

          <aside class="chat card">
            <div class="chat-head"><div><strong>Room chat</strong><small>Private to this room</small></div></div>
            <div id="messages" class="messages"></div>
            <form id="chatForm" class="chat-input">
              <input id="messageInput" maxlength="500" placeholder="Say something…" autocomplete="off">
              <button aria-label="Send">➤</button>
            </form>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <dialog id="settingsDialog">
    <form method="dialog" class="settings">
      <button class="close" value="cancel">×</button>
      <h3>Timer settings</h3>
      <label>Study minutes<input id="studyMinutes" type="number" min="1" max="180" value="50"></label>
      <label>Break minutes<input id="breakMinutes" type="number" min="1" max="60" value="10"></label>
      <button id="saveSettings" class="primary" value="default">Save</button>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
